<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>골목버림 - 사진 분리배출</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-tab="scan">
  <main class="page">
    <section class="block" data-sub="photo">
      <div class="two-col">
        <div>
          <h2 class="h-icon"><img src="img/idea.png" alt="">찍으면 버리는 법을 알려드려요</h2>
          <p class="sub">헷갈리는 쓰레기를 사진으로 올려 주세요</p>
          <label for="photo">사진 선택</label>
          <input type="file" id="photo" accept="image/*" capture="environment">
          <img id="preview" class="preview" alt="올린 사진 미리보기" hidden>
          <div class="btn-row"><button id="analyzeBtn" disabled>분석하기</button></div>
        </div>
        <div id="resultCard" hidden>
          <h2>이렇게 버려 주세요</h2>
          <div id="result"></div>
        </div>
      </div>
    </section>
  </main>

  <script>window.SUBTABS = [{ key: "photo", label: "사진으로 찾기" }];</script>
  <script src="js/api.js"></script>
  <script src="js/features.js"></script>
  <script src="js/layout.js"></script>
  <script>
    const photo = document.getElementById("photo");
    const btn = document.getElementById("analyzeBtn");
    const preview = document.getElementById("preview");

    photo.onchange = () => {
      const file = photo.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.hidden = false;
      btn.disabled = false;
    };

    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = "분석하는 중...";
      try {
        const r = await classifyImage(photo.files[0]);
        document.getElementById("result").innerHTML = `
          <div class="row"><span>물건</span><strong>${r.item}</strong></div>
          <div class="row"><span>분류</span><span class="badge info">${r.category}</span></div>
          <div class="panel"><ol style="margin:0">${r.steps.map(s => `<li>${s}</li>`).join("")}</ol></div>
          <p class="muted">AI 확신도 ${Math.round(r.confidence * 100)}%</p>`;
      } catch (e) {
        document.getElementById("result").innerHTML =
          '<div class="panel alert"><h3>분석하지 못했어요</h3><p>사진을 다시 올리거나 잠시 후 다시 눌러 주세요.</p></div>';
      }
      document.getElementById("resultCard").hidden = false;
      btn.textContent = "분석하기";
      btn.disabled = false;
    };
  </script>
</body>
</html>
