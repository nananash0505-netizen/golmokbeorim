<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>골목버림 - 로그인</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-tab="login">
  <main class="page">

    <!-- 로그인 -->
    <section class="block" data-sub="login">
      <form class="auth-box" id="loginForm" novalidate>
        <h2>로그인</h2>
        <p class="sub">로그인하면 무단투기 신고와 지킴이 인증을 할 수 있어요</p>
        <label for="loginId">아이디</label>
        <input id="loginId" autocomplete="username" required>
        <label for="loginPw">비밀번호</label>
        <input id="loginPw" type="password" autocomplete="current-password" required>
        <div class="btn-row"><button type="submit">로그인</button></div>
        <p class="auth-msg" id="loginMsg" role="alert"></p>
        <p class="muted">처음이신가요? <a href="#signup" data-go="signup" style="color:var(--blue-deep);font-weight:700">회원가입하기</a></p>
      </form>
    </section>

    <!-- 회원가입 -->
    <section class="block" data-sub="signup">
      <form class="auth-box" id="signupForm" novalidate>
        <h2>회원가입</h2>
        <p class="sub">우리 골목단지 주민으로 등록해요</p>
        <label for="suId">아이디</label>
        <input id="suId" autocomplete="username" required>
        <p class="hint">영문 소문자, 숫자, _ 로 4~20자</p>
        <label for="suPw">비밀번호</label>
        <input id="suPw" type="password" autocomplete="new-password" required>
        <p class="hint">6자 이상</p>
        <label for="suPw2">비밀번호 확인</label>
        <input id="suPw2" type="password" autocomplete="new-password" required>
        <label for="suName">이름(닉네임)</label>
        <input id="suName" maxlength="20" placeholder="예: 행복빌 302호 주민" required>
        <label for="suBuilding">사는 빌라</label>
        <select id="suBuilding" required></select>
        <input id="suBuildingOther" placeholder="빌라 이름을 입력해 주세요" maxlength="40" hidden>
        <label for="suUnit">호수 (선택)</label>
        <input id="suUnit" maxlength="10" placeholder="예: 302">
        <div class="btn-row"><button type="submit">가입하고 시작하기</button></div>
        <p class="auth-msg" id="signupMsg" role="alert"></p>
        <p class="muted">이미 계정이 있나요? <a href="#login" data-go="login" style="color:var(--blue-deep);font-weight:700">로그인하기</a></p>
      </form>
    </section>
  </main>

  <script>
    window.SUBTABS = [
      { key: "login", label: "로그인" },
      { key: "signup", label: "회원가입" }
    ];
  </script>
  <script src="js/api.js"></script>
  <script src="js/features.js"></script>
  <script src="js/layout.js"></script>
  <script>
    // 로그인 후 돌아갈 화면 (다른 사이트 주소는 받지 않음)
    function nextPage() {
      const n = new URLSearchParams(location.search).get("next") || "index.html";
      return /^[a-z]+\.html(#[a-z]+)?$/.test(n) && !n.startsWith("login") ? n : "index.html";
    }

    function setMsg(el, text, ok) {
      el.textContent = text;
      el.className = "auth-msg " + (ok ? "ok" : "err");
    }

    function done(user, verb) {
      showToast(verb, `${user.nickname}님, 반가워요!`);
      setTimeout(() => { location.href = nextPage(); }, 700);
    }

    // 입력을 고치면 이전 오류 문구는 지움
    document.getElementById("loginForm").oninput = () => { document.getElementById("loginMsg").textContent = ""; };
    document.getElementById("signupForm").oninput = () => { document.getElementById("signupMsg").textContent = ""; };

    document.querySelectorAll("[data-go]").forEach(a => a.onclick = e => {
      e.preventDefault();
      history.replaceState(null, "", "#" + a.dataset.go);
      showSub(a.dataset.go);
    });

    // 이미 로그인한 상태면 안내
    document.addEventListener("authchange", () => {
      const u = getCurrentUser();
      if (u) setMsg(document.getElementById("loginMsg"), `지금 ${u.nickname}님으로 로그인되어 있어요`, true);
    });

    // ----- 로그인 -----
    document.getElementById("loginForm").onsubmit = async e => {
      e.preventDefault();
      const msg = document.getElementById("loginMsg");
      const id = document.getElementById("loginId").value.trim();
      const pw = document.getElementById("loginPw").value;
      if (!id || !pw) return setMsg(msg, "아이디와 비밀번호를 입력해 주세요");
      const btn = e.target.querySelector("button");
      btn.disabled = true;
      try {
        done(await login(id, pw), "로그인 완료");
      } catch (err) {
        setMsg(msg, err.message);
        btn.disabled = false;
      }
    };

    // ----- 회원가입: 빌라 목록은 골목단지 참여 빌라에서 가져옴 -----
    async function loadBuildings() {
      const sel = document.getElementById("suBuilding");
      let names = [];
      try { names = (await getCluster(1)).buildings.map(b => b.name); } catch (e) {}
      names = [...new Set(names)];
      sel.innerHTML = `<option value="">빌라를 골라 주세요</option>` +
        names.map(n => `<option>${escapeHTML(n)}</option>`).join("") +
        `<option value="__other">목록에 없어요 (직접 입력)</option>`;
      sel.onchange = () => { document.getElementById("suBuildingOther").hidden = sel.value !== "__other"; };
    }
    loadBuildings();

    document.getElementById("signupForm").onsubmit = async e => {
      e.preventDefault();
      const msg = document.getElementById("signupMsg");
      const v = id => document.getElementById(id).value.trim();
      const sel = v("suBuilding");
      const building = sel === "__other" ? v("suBuildingOther") : sel;
      const form = {
        username: v("suId").toLowerCase(), password: document.getElementById("suPw").value,
        nickname: v("suName"), building, unit: v("suUnit")
      };
      if (!/^[a-z0-9_]{4,20}$/.test(form.username)) return setMsg(msg, "아이디는 영문 소문자, 숫자, _ 로 4~20자로 만들어 주세요");
      if (form.password.length < 6) return setMsg(msg, "비밀번호는 6자 이상이어야 해요");
      if (form.password !== document.getElementById("suPw2").value) return setMsg(msg, "비밀번호 확인이 달라요");
      if (!form.nickname) return setMsg(msg, "이름(닉네임)을 입력해 주세요");
      if (!building) return setMsg(msg, "사는 빌라를 골라 주세요");
      const btn = e.target.querySelector("button");
      btn.disabled = true;
      try {
        done(await signup(form), "회원가입 완료");
      } catch (err) {
        setMsg(msg, err.message);
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
